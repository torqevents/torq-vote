<style>
/* ============ TORQ VOTE ============ */
:root{
  --bg:#0b0b0d; --bg2:#111115; --card:#16161b; --card2:#1d1d24; --card3:#25252e;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --text:#f5f5f7; --muted:#9b9ba8; --dim:#6b6b78;
  --red:#ff2d2d; --red2:#ff5a36; --redglow:rgba(255,45,45,.35); --redbg:rgba(255,45,45,.12);
  --green:#2ee59d; --greenbg:rgba(46,229,157,.12); --amber:#ffb020; --amberbg:rgba(255,176,32,.12);
  --r:18px; --r-sm:12px;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Sora','Manrope',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
   radial-gradient(900px 500px at 85% -10%,rgba(255,45,45,.16),transparent 60%),
   radial-gradient(700px 400px at -10% 110%,rgba(255,90,54,.08),transparent 60%),
   linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/100% 44px;}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,h4{margin:0;line-height:1.1;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.hidden{display:none!important}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:8px}

/* ---------- boot / spinner ---------- */
.boot{min-height:100vh;display:grid;place-items:center}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--red);animation:spin .7s linear infinite}
.spinner.sm{width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- logo ---------- */
.logo{display:inline-grid;justify-items:center;gap:.5em;font-size:16px;line-height:1}
.lg-w{position:relative;display:block;width:100%}
.lg-w img{display:block;width:100%;height:auto}
.lg-w::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,90,54,.95) 48%,#fff 50%,rgba(255,90,54,.95) 52%,transparent 65%) -120% 0/250% 100% no-repeat;
  -webkit-mask:var(--src) center/100% 100% no-repeat;mask:var(--src) center/100% 100% no-repeat;opacity:0}
.lg-vote{display:flex;align-items:center;gap:.9em;width:100%;font:500 1em var(--display);letter-spacing:.7em;text-indent:.7em;color:var(--text);text-transform:uppercase}
.lg-vote::before,.lg-vote::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--red))}
.lg-vote::after{background:linear-gradient(270deg,transparent,var(--red))}
.lg-vote b{font-weight:600;color:var(--text)}
.logo.sm{display:flex;align-items:center;gap:10px}
.logo.sm .lg-w{width:84px}
.logo.sm .lg-vote{width:auto;font-size:10px;letter-spacing:.38em;text-indent:.38em;padding:4px 6px 4px 8px;border-radius:4px;background:var(--red);transform:skewX(-12deg)}
.logo.sm .lg-vote b{display:inline-block;transform:skewX(12deg);color:#fff}
.logo.sm .lg-vote::before,.logo.sm .lg-vote::after{display:none}
.logo.hero{width:min(330px,76vw);font-size:clamp(13px,3.6vw,17px)}

/* animated logo */
.logo.anim .lg-w img{clip-path:inset(0 100% 0 0);transform:translateX(-24px) skewX(-10deg);filter:blur(4px);animation:wordIn .75s var(--ease) .15s forwards}
.logo.anim .lg-w::after{animation:sheenLogo 1.1s ease-in-out .85s forwards}
.logo.anim .lg-vote{opacity:0;letter-spacing:1.6em;animation:voteIn .8s var(--ease) .8s forwards}
.logo.anim .lg-vote::before,.logo.anim .lg-vote::after{transform:scaleX(0);animation:lineIn .6s var(--ease) 1.05s forwards}
.logo.anim .lg-vote::before{transform-origin:right}.logo.anim .lg-vote::after{transform-origin:left}
@keyframes wordIn{to{clip-path:inset(0 0 0 0);transform:none;filter:none}}
@keyframes sheenLogo{0%{opacity:1;background-position:-120% 0}100%{opacity:1;background-position:220% 0}}
@keyframes voteIn{to{opacity:1;letter-spacing:.7em}}
@keyframes lineIn{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes stamp{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;place-items:center;align-content:center;gap:18px;overflow:hidden;cursor:pointer}
#intro.play{display:grid}
#intro .logo{width:min(440px,82vw);font-size:clamp(14px,4vw,20px);position:relative;z-index:2}
#intro .intro-sub{font:600 12px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--muted);opacity:0;animation:fadeIn .4s 1.5s forwards;position:relative;z-index:2}
#intro .intro-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--redglow),transparent 55%);opacity:0;animation:flash .9s ease-out 1.25s forwards}
@keyframes flash{30%{opacity:1}100%{opacity:.35}}
.intro-streaks{position:absolute;inset:0}
.intro-streaks i{position:absolute;height:2px;left:-40%;width:35%;background:linear-gradient(90deg,transparent,rgba(255,45,45,.7),transparent);animation:streak 1.1s linear infinite;opacity:.6}
@keyframes streak{to{transform:translateX(420%)}}
#intro.out{animation:introOut .6s var(--ease) forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.08);filter:blur(8px);visibility:hidden}}

/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(11,11,13,.78);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.tb-side{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.tb-side.r{justify-content:flex-end}
.tb-logo{flex:none}
.page{max-width:1080px;margin:0 auto;padding:20px 16px calc(60px + var(--safe-b));animation:pageIn .45s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}
.demo-bar{background:var(--amberbg);border-bottom:1px solid rgba(255,176,32,.25);color:#ffd27a;font-size:13px;padding:8px 16px;text-align:center}
.demo-bar b{color:#ffe0a3}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;background:var(--card2);border:1px solid var(--line2);transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s;white-space:nowrap;user-select:none}
.btn:hover{background:var(--card3)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:linear-gradient(135deg,var(--red2),var(--red));border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px var(--redglow)}
.btn.primary:hover{box-shadow:0 10px 30px -6px var(--redglow);filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--card)}
.btn.danger{color:#ff8a8a;border-color:rgba(255,45,45,.3);background:var(--redbg)}
.btn.ok{color:var(--green);border-color:rgba(46,229,157,.3);background:var(--greenbg)}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.big{height:56px;font-size:17px;width:100%}
.btn.block{width:100%}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:50%;color:var(--muted);transition:background .2s,color .2s,transform .15s;flex:none}
.icon-btn:hover{background:var(--card2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.sm svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:600;background:var(--card);transition:all .2s}
.chip:hover{border-color:var(--red)}
.chip svg{width:14px;height:14px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.pill.live{background:var(--redbg);color:#ff7a7a;border-color:rgba(255,45,45,.3)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 var(--red);animation:pulse 1.6s infinite}
.pill.open{background:var(--greenbg);color:var(--green);border-color:rgba(46,229,157,.25)}
.pill.pending{background:var(--amberbg);color:var(--amber);border-color:rgba(255,176,32,.25)}
.pill.draft{color:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,45,.6)}70%{box-shadow:0 0 0 7px rgba(255,45,45,0)}100%{box-shadow:0 0 0 0 rgba(255,45,45,0)}}

/* ---------- home ---------- */
.home-hero{text-align:center;padding:26px 0 30px}
.home-hero .tagline{margin-top:14px;color:var(--muted);font-size:17px}
.ev-list{display:grid;gap:12px}
.ev-card{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px;border-radius:var(--r);background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);overflow:hidden;transition:transform .25s var(--ease),border-color .25s;animation:rise .5s var(--ease) both;animation-delay:calc(min(var(--i,0),12) * 60ms)}
.ev-card:hover{transform:translateY(-2px);border-color:var(--line2)}
.ev-card.live{border-color:rgba(255,45,45,.35)}
.ev-card.live::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.5s ease-in-out infinite}
.ev-card h2{font-size:22px;font-weight:600;margin:10px 0 4px}
.ev-card p{color:var(--muted);font-size:14px}
.ev-go{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--red2);flex:none}
.ev-go svg{width:18px;height:18px;transition:transform .2s}
.ev-card:hover .ev-go svg{transform:translateX(4px)}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
.section-label{font:700 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:22px 0 2px}
.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:40px}
.foot a{color:var(--muted)} .foot a:hover{color:var(--text)}

/* ---------- empty / error ---------- */
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--muted)}
.empty .em-ic{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--red2)}
.empty .em-ic svg{width:26px;height:26px}
.empty h3{color:var(--text);font-size:18px;margin-bottom:6px}
.err-box{padding:16px;border-radius:var(--r-sm);background:var(--redbg);border:1px solid rgba(255,45,45,.3);color:#ffb0b0;font-size:14px}

/* ---------- vote: hero ---------- */
.ev-hero{padding:6px 0 18px}
.ev-hero h1{font-size:clamp(28px,6vw,44px);font-weight:600;text-transform:uppercase;letter-spacing:-.01em;margin:10px 0 6px}
.ev-hero p{color:var(--muted)}
.ended{margin-top:14px;padding:14px 16px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line);color:var(--muted)}

/* award tabs */
.award-tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 12px;scroll-snap-type:x proximity}
.award-tabs::-webkit-scrollbar{display:none}
.atab{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);transition:all .25s var(--ease)}
.atab svg{width:15px;height:15px}
.atab:hover{color:var(--text)}
.atab.on{background:var(--text);color:var(--bg);border-color:var(--text);transform:translateY(-1px)}
.atab.done:not(.on){color:var(--green);border-color:rgba(46,229,157,.3)}
.atab.locked:not(.on){opacity:.6}
.atab .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}

.award-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.award-head h2{font-size:26px;font-weight:600;display:flex;align-items:center;gap:10px}
.award-head h2 svg{width:24px;height:24px;color:var(--amber)}
.award-head p{color:var(--muted);margin-top:4px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.progress .bar{width:110px;height:6px;border-radius:9px;background:var(--card2);overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--red));border-radius:9px;transition:width .6s var(--ease)}
.vote-note{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-sm);margin-bottom:14px;font-size:14px;background:var(--greenbg);border:1px solid rgba(46,229,157,.25);color:var(--green);animation:rise .4s var(--ease)}
.vote-note.closed{background:var(--card);border-color:var(--line);color:var(--muted)}
.vote-note svg{width:18px;height:18px;flex:none}

/* search */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:16px;transition:border-color .2s}
.search:focus-within{border-color:var(--red)}
.search svg{width:18px;height:18px;color:var(--dim);flex:none}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}

/* car grid */
.car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media(min-width:700px){.car-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}}
.car-card{text-align:left;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s,opacity .3s;display:flex;flex-direction:column}
.car-grid.enter .car-card{animation:rise .45s var(--ease) both;animation-delay:calc(min(var(--i,0),16) * 35ms)}
.car-card:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 30px -14px rgba(0,0,0,.7)}
.car-card:active{transform:scale(.98)}
.car-card.picked{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 14px 34px -12px rgba(46,229,157,.35)}
.car-grid.voted .car-card:not(.picked){opacity:.45}
.car-grid.voted .car-card:not(.picked):hover{opacity:.8}
.car-img{position:relative;aspect-ratio:4/3;background:var(--card2);overflow:hidden}
.car-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.car-card:hover .car-img img{transform:scale(1.05)}
.car-num{position:absolute;top:8px;left:8px;font:700 13px var(--mono);padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);color:#fff}
.picked-badge{position:absolute;bottom:8px;left:8px;right:8px;display:flex;align-items:center;justify-content:center;gap:6px;height:30px;border-radius:9px;background:var(--green);color:#03150d;font-weight:600;font-size:13px;animation:stamp .35s var(--spring)}
.picked-badge svg{width:15px;height:15px}
.car-info{padding:11px 12px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.car-info b{font-size:15px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.car-info span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{width:100%;height:100%;display:grid;place-items:center;align-content:center;gap:4px;background:radial-gradient(120% 90% at 30% 20%,hsl(var(--h) 60% 22%),hsl(var(--h) 40% 9%));color:hsl(var(--h) 80% 75%)}
.ph svg{width:58%;max-width:150px;opacity:.85}
.ph-make{font:600 14px var(--display);text-transform:uppercase;letter-spacing:.12em;opacity:.8}
.skel{border-radius:var(--r);background:linear-gradient(100deg,var(--card) 40%,var(--card2) 50%,var(--card) 60%) 0 0/300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{to{background-position:-150% 0}}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.sheet-wrap{align-items:center}}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;transition:opacity .28s}
.sheet{position:relative;width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + var(--safe-b));transform:translateY(100%);transition:transform .32s var(--ease)}
.sheet.wide{max-width:640px}
@media(min-width:700px){.sheet{border-radius:24px;transform:translateY(30px) scale(.96);opacity:0;transition:transform .3s var(--ease),opacity .25s}}
.sheet-wrap.open .sheet-bg{opacity:1}
.sheet-wrap.open .sheet{transform:none;opacity:1}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:-8px auto 14px}
@media(min-width:700px){.sheet::before{display:none}}
.sheet-x{position:absolute;top:12px;right:12px}
.sheet h3{font-size:22px;font-weight:600;margin-bottom:6px;padding-right:40px}
.sheet .sub{color:var(--muted);margin-bottom:18px;font-size:14px}
.sheet-car{margin:-2px -2px 16px;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--card2)}
.sheet-car img{width:100%;height:100%;object-fit:cover}
.sheet-actions{display:grid;gap:8px;margin-top:18px}
.sheet .award-chip{display:inline-flex;align-items:center;gap:6px;color:var(--amber);font-weight:600}
.sheet .award-chip svg{width:16px;height:16px}

/* ---------- forms ---------- */
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:.8fr 1fr 1fr;gap:12px}
@media(max-width:420px){.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1/-1}}
.fld{display:grid;gap:6px}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.fld>span em{color:var(--red2);font-style:normal}
.inp{width:100%;height:48px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line2);outline:0;font-size:16px;transition:border-color .2s,box-shadow .2s}
textarea.inp{height:auto;min-height:90px;padding:12px 14px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--redbg)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--red)}
.photo-drop{position:relative;display:grid;place-items:center;gap:6px;min-height:150px;border-radius:14px;border:1.5px dashed var(--line2);background:var(--card);color:var(--muted);text-align:center;cursor:pointer;overflow:hidden;transition:border-color .2s}
.photo-drop:hover{border-color:var(--red)}
.photo-drop svg{width:28px;height:28px;color:var(--red2)}
.photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.form-card{max-width:560px;margin:0 auto;padding:24px 20px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.form-title{text-align:center;margin-bottom:20px}
.form-title h1{font-size:28px;font-weight:600;text-transform:uppercase}
.form-title p{color:var(--muted);margin-top:6px}

/* ---------- success / celebrate ---------- */
.celebrate{position:fixed;inset:0;z-index:300;display:grid;place-items:center;align-content:center;gap:16px;text-align:center;background:rgba(5,5,7,.82);backdrop-filter:blur(8px);animation:fadeIn .25s;padding:24px}
.celebrate.out{animation:introOut .45s forwards}
.cb-check{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:var(--green);box-shadow:0 0 0 0 rgba(46,229,157,.5);animation:pop .55s var(--spring),ring 1.2s .2s ease-out}
.cb-check svg{width:62px;height:62px;color:#03150d;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .3s forwards}
.celebrate h2{font:600 34px var(--display);text-transform:uppercase;animation:rise .5s .2s var(--ease) both}
.celebrate p{color:var(--muted);max-width:340px;animation:rise .5s .3s var(--ease) both}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes ring{to{box-shadow:0 0 0 40px rgba(46,229,157,0)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:400}

/* ---------- toast ---------- */
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + var(--safe-b));z-index:500;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{max-width:420px;padding:12px 18px;border-radius:14px;background:var(--card3);border:1px solid var(--line2);font-size:14px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.8);animation:toastIn .35s var(--spring);pointer-events:auto}
.toast.err{background:#3a1416;border-color:rgba(255,45,45,.4);color:#ffc7c7}
.toast.ok{background:#0f2b20;border-color:rgba(46,229,157,.35);color:#b7f5da}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* ---------- admin ---------- */
.admin-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font:700 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--red2);margin-bottom:6px}
.admin-head h1{font-size:30px;font-weight:600}
.admin-head .meta{color:var(--muted);margin-top:6px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.a-list{display:grid;gap:10px}
.a-row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:border-color .2s,transform .2s var(--ease);animation:rise .4s var(--ease) both;animation-delay:calc(min(var(--i,0),12) * 45ms)}
.a-row:hover{border-color:var(--line2)}
a.a-row:hover{transform:translateX(3px)}
.a-row .grow{flex:1;min-width:0}
.a-row h3{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-row p{color:var(--muted);font-size:13px;margin-top:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a,.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;transition:all .2s}
.seg a:hover,.seg button:hover{color:var(--text)}
.seg .on{background:var(--card3);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font:700 11px/20px var(--mono);text-align:center}
.badge:empty{display:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync.busy i{background:var(--amber);animation:pulse 1s infinite}
.grid2{display:grid;gap:14px}
@media(min-width:800px){.grid2{grid-template-columns:1fr 1fr}}
.card{padding:20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
.card h3{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:18px;height:18px;color:var(--red2)}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
.stat b{display:block;font:700 30px var(--mono);letter-spacing:-.03em}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.status-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.status-seg button{height:64px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;display:grid;place-items:center;align-content:center;gap:2px;transition:all .2s}
.status-seg button small{font-weight:500;font-size:11px;color:var(--muted)}
.status-seg button.on{border-color:var(--text);background:var(--card3)}
.status-seg button.on[data-status=live]{border-color:var(--red);background:var(--redbg);color:#ff8a8a}
.status-seg button.on[data-status=closed]{border-color:var(--muted)}
.share{display:flex;gap:16px;align-items:center}
.qr{flex:none;width:116px;height:116px;padding:8px;border-radius:12px;background:#fff;display:grid;place-items:center}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.share .grow{flex:1;min-width:0;display:grid;gap:8px}
.url{font:600 12px var(--mono);color:var(--muted);word-break:break-all;padding:8px 10px;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .seg{margin:0;flex:1;min-width:260px}
.car-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);animation:rise .35s var(--ease) both;animation-delay:calc(min(var(--i,0),14) * 30ms)}
.car-row .thumb{width:84px;height:64px;border-radius:10px;overflow:hidden;flex:none;background:var(--card2)}
.car-row .thumb img{width:100%;height:100%;object-fit:cover}
.car-row .thumb .ph svg{width:70%}
.car-row .thumb .ph-make{display:none}
.car-row .grow{flex:1;min-width:0}
.car-row h4{font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.car-row .num{font:700 13px var(--mono);color:var(--red2)}
.car-row p{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.car-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:200px}
@media(max-width:600px){.car-row{flex-wrap:wrap}.car-row .acts{max-width:none;width:100%;justify-content:flex-start}}
.list{display:grid;gap:8px}

/* =====================================================================
   TORQ VOTE — app.js
   Public voting + admin console + big screen.
   Backend: the same Supabase project as the TORQ vehicle submission
   form. Only APPROVED cars from that form show up for voting, with
   their photos, and the lineup refreshes on its own.
   ===================================================================== */

const CFG = window.TORQ_CONFIG || {};
const DEMO = !!CFG.demo || !(CFG.supabaseUrl && CFG.supabaseKey);
const PORTAL = CFG.submissionPortal || 'https://torqvehiclesubmission.netlify.app/#admin';

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = (n = 10) => { const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; let s = ''; for (const x of crypto.getRandomValues(new Uint8Array(n))) s += a[x % 36]; return s; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const safeUrl = u => (typeof u === 'string' && /^(https:\/\/|blob:|data:image\/(jpeg|png|webp);)/i.test(u.trim())) ? u.trim() : '';
const handle = ig => { if (!ig) return ''; const h = String(ig).trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/[/?#].*$/, '').replace(/^@/, ''); return h ? '@' + h : ''; };
const fmtDate = d => { if (!d) return ''; if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return d; const x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }); };
const link = h => location.origin + location.pathname + '#/' + h;
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

const numLabel = c => c && c.number != null ? '#' + c.number : '#–';

/* =====================================================================
   DATA: SUPABASE (shared with the vehicle submission form)
   ===================================================================== */
async function supabaseAdapter() {
  if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { storageKey: 'torqvote-auth' } });
  const BUCKET = CFG.photoBucket || 'torq-uploads';
  const THUMBS = 'torq-vote-thumbs';
  const ok = r => { if (r.error) throw r.error; return r.data; };
  const mapEv = r => r && ({ id: r.id, name: r.name, date: r.event_date, location: r.location, status: r.status, formEventId: r.form_event_id || null, showResults: r.show_results !== false });
  const unEv = p => { const o = {}; if ('name' in p) o.name = p.name; if ('date' in p) o.event_date = p.date; if ('location' in p) o.location = p.location; if ('status' in p) o.status = p.status; if ('formEventId' in p) o.form_event_id = p.formEventId; if ('showResults' in p) o.show_results = !!p.showResults; return o; };
  const mapAw = r => ({ id: r.id, eventId: r.vote_event_id, name: r.name, desc: r.description || '', open: !!r.is_open, sort: r.sort || 0, created: r.created_at });
  const unAw = p => { const o = {}; if ('name' in p) o.name = p.name; if ('desc' in p) o.description = p.desc; if ('open' in p) o.is_open = p.open; if ('sort' in p) o.sort = p.sort; return o; };
  const thumbUrl = (id, v) => v ? `${CFG.supabaseUrl}/storage/v1/object/public/${THUMBS}/${encodeURIComponent(id)}.jpg?v=${v}` : '';

  // signed photo URLs, cached until shortly before they expire
  const signed = new Map();
  async function photoUrls(paths) {
    const now = Date.now(), need = [...new Set(paths.filter(p => p && !(signed.get(p)?.exp > now)))];
    for (let i = 0; i < need.length; i += 100) {
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i, i + 100), 3600);
      if (error) { console.warn(error); break; }
      (data || []).forEach(d => { if (d.signedUrl) signed.set(d.path, { url: d.signedUrl, exp: now + 50 * 60e3 }); });
    }
    const out = {}; paths.forEach(p => { const s = signed.get(p); if (s) out[p] = s.url; }); return out;
  }

  async function profile(session) {
    if (!session) return null;
    const { data } = await sb.from('team_profiles').select('id,name,email,role').eq('id', session.user.id).maybeSingle();
    return { uid: session.user.id, email: session.user.email, name: data?.name || '', isAdmin: !!data };
  }

  let thumbsBusy = false;
  return {
    demo: false,
    onAuth(cb) {
      let last = '';
      const emit = s => setTimeout(async () => { const key = s?.user?.id || ''; if (key === last && key) return; last = key; cb(await profile(s)); }, 0);
      sb.auth.getSession().then(({ data }) => emit(data.session));
      sb.auth.onAuthStateChange((_e, s) => emit(s));
    },
    async signIn(email, pw) { const { error } = await sb.auth.signInWithPassword({ email: String(email).trim(), password: pw }); if (error) throw error; },
    signOut: () => sb.auth.signOut(),

    async listEvents(admin) {
      let q = sb.from('vote_events').select('*').order('created_at', { ascending: false });
      if (!admin) q = q.in('status', ['live', 'closed']);
      return ok(await q).map(mapEv);
    },
    async getEvent(id) { return mapEv(ok(await sb.from('vote_events').select('*').eq('id', id).maybeSingle())); },
    async createEvent(d) { return ok(await sb.from('vote_events').insert({ ...unEv(d), status: 'draft' }).select('id').single()).id; },
    async updateEvent(id, p) { ok(await sb.from('vote_events').update(unEv(p)).eq('id', id)); },
    async deleteEvent(id) { ok(await sb.from('vote_events').delete().eq('id', id)); },

    async listAwards(eid) { return ok(await sb.from('vote_awards').select('*').eq('vote_event_id', eid).order('sort').order('created_at')).map(mapAw); },
    async addAward(eid, a) { ok(await sb.from('vote_awards').insert({ vote_event_id: eid, ...unAw(a) })); },
    async updateAward(id, p) { ok(await sb.from('vote_awards').update(unAw(p)).eq('id', id)); },
    async deleteAward(id) { ok(await sb.from('vote_awards').delete().eq('id', id)); },

    async lineup(eid) {
      const rows = ok(await sb.rpc('vote_lineup', { p_event: eid })) || [];
      return rows.map(r => ({ id: r.id, number: r.number, vehicle: r.vehicle, owner: r.owner, social: r.social, club: r.club, photos: r.photos || [], thumb: thumbUrl(r.id, r.thumb_version), hidden: !!r.hidden }));
    },
    photoUrls,
    async setHidden(eid, carId, hide) {
      if (hide) ok(await sb.from('vote_hidden_cars').upsert({ vote_event_id: eid, submission_id: carId }));
      else ok(await sb.from('vote_hidden_cars').delete().eq('vote_event_id', eid).eq('submission_id', carId));
    },
    async myBallot(eid) {
      const rows = ok(await sb.rpc('vote_my_ballot', { p_event: eid, p_voter: voterId() })) || [];
      const v = {}; rows.forEach(r => v[r.award_id] = r.submission_id); return v;
    },
    async vote(eid, aid, carId) { ok(await sb.rpc('vote_cast', { p_award: aid, p_car: carId, p_voter: voterId() })); },
    async results(eid) {
      const [rows, voters] = await Promise.all([sb.rpc('vote_results', { p_event: eid }).then(ok), sb.rpc('vote_voter_count', { p_event: eid }).then(ok)]);
      const t = {}; (rows || []).forEach(r => { (t[r.award_id] ||= {})[r.submission_id] = Number(r.votes); });
      return { tallies: t, voters: voters || 0 };
    },
    async publicResults(eid) {
      const rows = ok(await sb.rpc('vote_public_results', { p_event: eid, p_voter: voterId() })) || [];
      const t = {}; rows.forEach(r => { (t[r.award_id] ||= {})[r.submission_id] = Number(r.votes); }); return t;
    },
    async formEvents() { return ok(await sb.from('events').select('id,name,event_date,location,active,created_at').order('created_at', { ascending: false })); },
    async pendingCount(formEventId) {
      const r = await sb.from('submissions').select('id', { count: 'exact', head: true }).eq('event_id', formEventId).eq('status', 'pending');
      if (r.error) throw r.error; return r.count || 0;
    },
    // Make small public copies of car photos so voters' phones load fast.
    async ensureThumbs(cars, onDone) {
      if (thumbsBusy) return; const todo = cars.filter(c => !c.thumb && c.photos[0]); if (!todo.length) return;
      thumbsBusy = true; let made = 0;
      try {
        const urls = await photoUrls(todo.map(c => c.photos[0]));
        for (const c of todo) {
          try {
            const src = urls[c.photos[0]]; if (!src) continue;
            const blob = await (await fetch(src)).blob();
            const bmp = await createImageBitmap(blob);
            const s = Math.min(1, 640 / Math.max(bmp.width, bmp.height));
            const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
            cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);

            ok(await sb.storage.from(THUMBS).upload(`${c.id}.jpg`, small, { upsert: true, contentType: 'image/jpeg', cacheControl: '31536000' }));
            ok(await sb.from('vote_car_numbers').update({ thumb_version: Date.now() }).eq('submission_id', c.id));
            made++;
          } catch (e) { console.warn('thumb', c.id, e); }
        }
      } finally { thumbsBusy = false; if (made) onDone?.(); }
    },
  };
}

// Re-runs fn every `ms` (slower when the tab is hidden) and hands results to cb.
function poll(fn, ms, cb) {
  let alive = true, t = null, busy = false;
  const run = async () => {
    if (!alive || busy) return; busy = true; clearTimeout(t);
    try { const r = await fn(); if (alive) cb(r, null); } catch (e) { console.warn(e); if (alive) cb(undefined, e); }
    busy = false; if (alive) t = setTimeout(run, document.hidden ? ms * 4 : ms);
  };
  const vis = () => { if (!document.hidden) run(); };
  document.addEventListener('visibilitychange', vis);
  run();
  const stop = () => { alive = false; clearTimeout(t); document.removeEventListener('visibilitychange', vis); };
  stop.now = () => { busy = false; run(); };
  return track(stop);
}

}

    const heroHtml = `<div class="hero-row"><span class="pill ${live ? 'live' : ''}">${live ? 'Voting live' : 'Voting ended'}</span>${canSee ? `<a class="standings-btn" href="#/e/${eid}/live">${I.chart} Live standings</a>` : ''}</div><h1>${esc(st.ev.name)}</h1><p>${esc([fmtDate(st.ev.date), st.ev.location].filter(Boolean).join(' · '))}</p>${!live ? `<div class="ended">Voting for this event has ended. Thanks for coming out!</div>` : ''}`;

function countUp(el, to, fmt = v => Math.round(v)) {
  const from = parseFloat(el.dataset.v || '0'); el.dataset.v = to;
  if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), d = 700;
  (function f(t) { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1 && el.isConnected) requestAnimationFrame(f); })(t0);
}
function rankRows(tally, cars) {
  const total = Object.values(tally || {}).reduce((a, b) => a + b, 0);
  const rows = Object.entries(tally || {}).map(([id, n]) => ({ car: cars.find(c => c.id === id) || { id, vehicle: 'Removed car', photos: [] }, n, pct: total ? n / total * 100 : 0 }))
    .sort((a, b) => b.n - a.n || (a.car.number ?? 1e9) - (b.car.number ?? 1e9));
  return { rows, total };
}

<div class="lead-stat"><b class="cu" data-to="${top.pct}" data-v="${sameAward ? (st.lastPct?.[a.id] ?? 0) : 0}">0</b><span>% of the vote<br>${plural(top.n, 'vote')} · ${esc(margin)}</span></div>
${mine === top.car.id ? `<span class="mine-tag">${I.check} Your pick</span>` : ''}</div></div>
<div class="race-head"><h3>${I.trophy}${esc(a.name)}</h3><span class="muted small">${plural(total, 'vote')}</span></div>
<div class="race">${rows.slice(0, 10).map((r, i) => `<div class="race-row ${mine === r.car.id ? 'mine' : ''}" data-k="${esc(r.car.id)}" style="--i:${i}">
<span class="rk">${i === 0 ? I.crown : i + 1}</span><div class="th">${carImg(r.car, st.urls)}</div>
<div class="bx"><b>${numLabel(r.car)} ${esc(carName(r.car))}${mine === r.car.id ? ' <em>Your pick</em>' : ''}</b><div class="track"><i style="width:${sameAward && prevW[r.car.id] ? prevW[r.car.id] : '0%'}" data-w="${Math.max(2, r.n / max * 100)}%"></i></div></div>
<span class="ct"><span><b class="cu" data-to="${Math.round(r.pct)}" data-v="${sameAward ? (st.lastRow?.[r.car.id] ?? 0) : 0}">0</b>%</span><small>${plural(r.n, 'vote')}</small></span></div>`).join('')}</div>
${rows.length > 10 ? `<p class="muted small" style="text-align:center;margin-top:10px">+ ${rows.length - 10} more cars with votes</p>` : ''}`;
    st.lastPct = { ...(st.lastPct || {}), [a.id]: top.pct };
    st.lastRow = Object.fromEntries(rows.map(r => [r.car.id, Math.round(r.pct)]));

    // animate: bars grow, numbers count, rows glide to new rank
    requestAnimationFrame(() => {
      $$('.track i', body).forEach(i => i.style.width = i.dataset.w);
      $$('.cu', body).forEach(el => countUp(el, parseFloat(el.dataset.to), v => Math.round(v)));
      if (sameAward) $$('.race-row', body).forEach(r => {
        const old = before[r.dataset.k]; if (old == null) return;
        const dy = old - r.getBoundingClientRect().top; if (!dy) return;
        r.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)' });
      });
      if (newLeader) confetti(80);
    });
  }

  appEl.onclick = e => {
    const t = e.target.closest('[data-aw]');
    if (t) { st.award = t.dataset.aw; try { sessionStorage.setItem('tv-live-' + eid, st.award); } catch { } buzz(8); render(); t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); return; }
    const g = e.target.closest('[data-goaward]'); if (g) { try { sessionStorage.setItem('tv-goaward-' + eid, g.dataset.goaward); } catch { } }
  };
}

async function eventForm(ev, done) {
  const s = openSheet(`<h3>${ev ? 'Edit event' : 'New vote event'}</h3><p class="sub">${ev ? 'Update what voters see.' : 'Pick the event from the TORQ submission form. Its approved cars become the voting lineup.'}</p>
<form class="form"><label class="fld"><span>Submission form event <em>*</em></span><select class="inp" name="formEventId" id="f-formEventId"><option value="">Loading events…</option></select></label>
${fld('Name voters see', 'name', { req: true, value: ev?.name || '', ph: 'TORQ: FALL 2026' })}
<div class="row2">${fld('Date', 'date', { value: ev?.date || '', ph: 'Oct 31, 2026' })}${fld('Location', 'location', { value: ev?.location || '', ph: 'Cumming City Center' })}</div>
<div class="sheet-actions"><button class="btn primary big" type="submit">${ev ? 'Save' : 'Create event'}</button></div></form>`);
  const sel = $('[name=formEventId]', s), form = $('form', s);
  let fes = [];
  try {
    fes = await D.formEvents();
    sel.innerHTML = `<option value="">Choose an event…</option>` + fes.map(f => `<option value="${esc(f.id)}" ${ev?.formEventId === f.id ? 'selected' : ''}>${esc(f.name)}${f.event_date ? ' · ' + esc(f.event_date) : ''}${f.active ? '' : ' (closed)'}</option>`).join('');
    if (!ev && fes.length === 1) { sel.value = fes[0].id; sel.dispatchEvent(new Event('change')); }
  } catch (e) { console.warn(e); sel.innerHTML = `<option value="">Couldn't load events</option>`; }
  sel.onchange = () => {
    const f = fes.find(x => x.id === sel.value); if (!f) return;
    if (!ev || !form.name.value) form.name.value = f.name || '';
    if (!ev || !form.date.value) form.date.value = f.event_date || '';
    if (!ev || !form.location.value) form.location.value = f.location || '';
  };
  if (!ev && fes.length === 1) sel.onchange();
  form.onsubmit = async e => {
    e.preventDefault(); const d = formData(form);
    if (!d.formEventId) { toast('Pick the submission form event', 'err'); return; }
    if (!d.name) { toast('Give the event a name', 'err'); return; }
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try {
      const p = { name: d.name.slice(0, 120), date: d.date, location: d.location, formEventId: d.formEventId };
      if (ev) { await D.updateEvent(ev.id, p); closeSheet(); toast('Saved', 'ok'); done?.(ev.id); }
      else { const id = await D.createEvent(p); closeSheet(); done?.(id); }
    } catch (err) { console.warn(err); btn.disabled = false; toast(isSetupErr(err) ? 'Run supabase-setup.sql first (see README).' : 'Couldn’t save. Check that you’re signed in as a team member.', 'err'); }
  };
}

<div class="list">${aw.length ? aw.map((a, i) => { const n = Object.values(st.res.tallies[a.id] || {}).reduce((x, y) => x + y, 0); return `<div class="award-row ${a.open ? 'is-open' : ''}" style="--i:${st.anim ? i : 0}">
<div class="ord"><button class="icon-btn" data-up="${a.id}" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>${I.up}</button><button class="icon-btn" data-down="${a.id}" aria-label="Move down" ${i === aw.length - 1 ? 'disabled' : ''}>${I.down}</button></div>
<div class="grow"><h4>${esc(a.name)}</h4><p>${a.open ? '<span style="color:var(--green)">Voting open</span>' : 'Closed'} · ${plural(n, 'vote')}${a.desc ? ' · ' + esc(a.desc) : ''}</p></div>
<span class="switch ${a.open ? 'on' : ''}" data-toggle="${a.id}" role="switch" aria-checked="${a.open}" aria-label="Voting open" tabindex="0"></span>
<button class="icon-btn sm" data-aedit="${a.id}" aria-label="Edit">${I.edit}</button><button class="icon-btn sm" data-adel="${a.id}" aria-label="Delete">${I.trash}</button></div>`; }).join('')
        : empty('No awards yet', 'Tap a preset above or create your own.', I.trophy)}</div>`;
  }
  const nextSort = () => Math.max(0, ...st.awards.map(a => a.sort || 0)) + 1;
  function awardForm(a) {
    const s = openSheet(`<h3>${a ? 'Edit award' : 'New award'}</h3><p class="sub">${a ? 'Renaming keeps the votes already cast.' : 'Shows up on voters’ phones right away.'}</p>
<form class="form">${fld('Award name', 'name', { req: true, value: a?.name || '', ph: 'Best in Show' })}${fld('Short description', 'desc', { value: a?.desc || '', ph: 'Optional' })}
${a ? '' : `<label class="check"><input type="checkbox" name="open" id="f-open" checked> Open voting now</label>`}
<div class="sheet-actions"><button class="btn primary big" type="submit">${a ? 'Save' : 'Add award'}</button></div></form>`);
    s.querySelector('form').onsubmit = async e => {
      e.preventDefault(); const d = formData(e.target); if (!d.name) return;
      try {
        if (a) await D.updateAward(a.id, { name: d.name.slice(0, 80), desc: d.desc }); else await D.addAward(eid, { name: d.name.slice(0, 80), desc: d.desc, open: !!d.open, sort: nextSort() });
        closeSheet(); toast(a ? 'Award saved' : 'Award added', 'ok'); pEv.now();
      } catch (err) { console.warn(err); toast('Couldn’t save the award.', 'err'); }
    };
  }

  /* ---- results ---- */
  function renderResults() {
    const body = $('#ae-body'), aw = st.awards;
    if (!aw.length) { body.innerHTML = empty('No awards yet', 'Add awards on the Awards tab.', I.trophy); return; }
    const grow = st.anim;
    body.innerHTML = `<div class="toolbar"><div><h3 style="font-size:18px">Live results</h3><p class="muted small">${plural(st.res.voters, 'voter')} so far · updates every few seconds</p></div>
<div class="btn-row"><button class="btn sm" data-act="export">${I.download} Export CSV</button><a class="btn sm" href="#/screen/${eid}">${I.screen} Big screen</a></div></div>
<section class="winners" style="--i:0"><div class="win-head"><h3>${I.crown}Winners board</h3><div class="btn-row"><button class="btn sm" data-act="copy-winners">${I.copy} Copy winners</button><a class="btn sm" href="#/e/${eid}/live" target="_blank" rel="noopener">${I.chart} Voter view</a></div></div>
<div class="win-list">${aw.map((a, i) => { const r = ranked(a.id), t = r[0], s = r[1], tot = r.reduce((x, y) => x + y.n, 0); const tie = t && s && t.n === s.n;
      return `<div class="win-row" style="--i:${i}" data-reveal="${a.id}"><div class="win-award"><b>${esc(a.name)}</b><span class="muted small">${plural(tot, 'vote')} · ${a.open ? '<span style="color:var(--green)">open</span>' : 'closed'}</span></div>
${t ? `<div class="win-car"><div class="th">${carImg(t.car, st.urls)}</div><div class="grow"><b>${numLabel(t.car)} ${esc(carName(t.car))}</b><span class="muted small">${esc(carMeta(t.car))}</span></div></div>
<div class="win-stat">${tie ? `<span class="pill pending">Tie</span>` : `<span class="pill open">+${t.n - (s?.n || 0)}</span>`}<b>${t.n}</b><span class="muted small">${tot ? Math.round(t.n / tot * 100) : 0}%</span></div>` : `<div class="win-car muted small">No votes yet</div><div></div>`}</div>`; }).join('')}</div></section>
<div class="grid2">${aw.map((a, i) => resultsCard(a, ranked(a.id), i, grow, st.urls)).join('')}</div>`;
  }
  function winnersText() {
    return `${st.ev.name} — TORQ VOTE winners\n` + st.awards.map(a => { const r = ranked(a.id), t = r[0]; if (!t) return `${a.name}: no votes`; const ties = r.filter(x => x.n === t.n);
      return `${a.name}: ` + ties.map(x => `${numLabel(x.car)} ${carName(x.car)}${x.car.owner ? ' (' + x.car.owner + (x.car.social ? ' ' + handle(x.car.social) : '') + ')' : ''}`).join(' & ') + ` — ${plural(t.n, 'vote')}${ties.length > 1 ? ' (tie)' : ''}`; }).join('\n');
  }
  function exportCSV() {
    const rows = [['Award', 'Rank', 'Car #', 'Vehicle', 'Owner', 'Instagram', 'Club', 'Votes']];
    st.awards.forEach(a => ranked(a.id).forEach((r, i) => rows.push([a.name, i + 1, r.car.number ?? '', r.car.vehicle || '', r.car.owner || '', handle(r.car.social), r.car.club || '', r.n])));
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `${(st.ev.name || 'results').replace(/[^\w]+/g, '-')}-results.csv`; a.click();
  }

  /* ---- clicks ---- */
  appEl.onclick = async e => {
    const el = e.target.closest('button,a,[data-toggle]'); if (!el) return;
    const ds = el.dataset;
    try {
      if (ds.tab) { st.tab = ds.tab; st.anim = true; history.replaceState(null, '', `#/admin/${eid}/${ds.tab}`); $$('#ae-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ds.tab)); refresh('tab'); scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (ds.copy) return copy(ds.copy);
      if (ds.cfilter) { st.carFilter = ds.cfilter; st.anim = true; renderCars(); st.anim = false; return; }
      if (ds.hide) {
        const c = st.cars.find(x => x.id === ds.hide);
        if (!await confirmBox(`Remove ${numLabel(c)} ${carName(c)} from voting?`, 'It disappears from voters’ phones, can’t get new votes, and its votes stop counting. Nothing changes in the submission portal. You can restore it any time from the Removed tab.', 'Remove from voting', true)) return;
        await D.setHidden(eid, c.id, true); c.hidden = true; carSig = ''; renderCars(); toast(`${numLabel(c)} removed from voting`, 'ok'); pCars.now(); pRes.now(); return;
      }
      if (ds.unhide) { const c = st.cars.find(x => x.id === ds.unhide); await D.setHidden(eid, c.id, false); c.hidden = false; carSig = ''; renderCars(); toast(`${numLabel(c)} is back in voting`, 'ok'); pCars.now(); pRes.now(); return; }
      if (ds.status) {
        if (ds.status === st.ev.status) return;
        if (ds.status === 'live' && !st.ev.formEventId) { toast('Link a submission event first', 'err'); return; }
        if (ds.status === 'closed' && !await confirmBox('Close voting?', 'Every award stops taking votes. You can reopen later.', 'Close voting')) return;
        await D.updateEvent(eid, { status: ds.status }); toast(`Event is now ${ds.status}`, 'ok'); pEv.now(); return;
      }
      if (ds.preset) { el.disabled = true; await D.addAward(eid, { name: ds.preset, desc: '', open: true, sort: nextSort() }); toast(`${ds.preset} added and open`, 'ok'); pEv.now(); return; }
      if (ds.toggle) { const a = st.awards.find(x => x.id === ds.toggle); el.classList.toggle('on'); buzz(10); await D.updateAward(a.id, { open: !a.open }); pEv.now(); return; }
      if (ds.aedit) return awardForm(st.awards.find(x => x.id === ds.aedit));
      if (ds.adel) { const a = st.awards.find(x => x.id === ds.adel); if (await confirmBox(`Delete “${a.name}”?`, 'The award and its votes are removed.', 'Delete', true)) { await D.deleteAward(a.id); pEv.now(); pRes.now(); } return; }
      if (ds.up || ds.down) {
        const aw = st.awards, i = aw.findIndex(a => a.id === (ds.up || ds.down)), j = ds.up ? i - 1 : i + 1; if (j < 0 || j >= aw.length) return;
        const order = aw.map(a => a.id); [order[i], order[j]] = [order[j], order[i]];
        await Promise.all(order.map((id, k) => D.updateAward(id, { sort: k }))); pEv.now(); return;
      }
      if (ds.reveal) { const a = st.awards.find(x => x.id === ds.reveal); return reveal(a.name, ranked(a.id), st.urls); }
      switch (ds.act) {
        case 'logout': await D.signOut(); location.hash = '#/'; break;
        case 'edit-ev': eventForm(st.ev, () => refreshAll()); break;
        case 'del-ev': if (await confirmBox(`Delete ${st.ev.name}?`, 'This removes the vote event, its awards and all votes. Car submissions stay in the portal.', 'Delete forever', true)) { await D.deleteEvent(eid); toast('Vote event deleted', 'ok'); location.hash = '#/admin'; } break;
        case 'add-award': awardForm(); break;
        case 'open-all': case 'close-all': await Promise.all(st.awards.map(a => D.updateAward(a.id, { open: ds.act === 'open-all' }))); toast(ds.act === 'open-all' ? 'All awards open' : 'All awards closed', 'ok'); pEv.now(); break;
        case 'export': exportCSV(); break;
        case 'toggle-results': await D.updateEvent(eid, { showResults: !st.ev.showResults }); toast(st.ev.showResults ? 'Live standings hidden from voters' : 'Voters can now see live standings', 'ok'); pEv.now(); break;
        case 'copy-winners': copy(winnersText()); break;
        case 'demo-approve': { const s = D.demoApproveNext?.(st.ev.formEventId); toast(s ? `Approved in portal: ${s.vehicle}` : 'No pending demo cars left', s ? 'ok' : ''); pCars.now(); pPend.now(); break; }
      }
    } catch (err) { console.warn(err); toast('That didn’t save. Check your connection and that you’re signed in.', 'err'); }
  };
  appEl.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=switch]')) { e.preventDefault(); e.target.click(); } };
}

/* shared: results card + reveal */
function resultsCard(a, rows, i, grow, urls) {
  const total = rows.reduce((x, r) => x + r.n, 0), max = rows[0]?.n || 1;
  return `<div class="res-card" style="--i:${i}" data-reveal="${a.id}"><div class="res-head"><div><h3>${I.trophy}${esc(a.name)}</h3><p class="muted small">${plural(total, 'vote')} · ${a.open ? '<span style="color:var(--green)">open</span>' : 'closed'}</p></div>${rows.length ? `<button class="btn sm primary" data-reveal="${a.id}">Reveal winner</button>` : ''}</div>
<div class="bars ${grow ? 'grow' : ''}">${rows.length ? rows.slice(0, 8).map((r, k) => `<div class="bar-row" style="--n:${k}"><span class="rk">${k + 1}</span><div class="th">${carImg(r.car, urls)}</div><div class="bx"><b>${numLabel(r.car)} ${esc(carName(r.car))}</b><div class="track"><i style="--w:${Math.max(3, r.n / max * 100)}%"></i></div></div><span class="ct">${r.n}</span></div>`).join('') : '<p class="muted small">No votes yet.</p>'}</div>
${rows.length ? '<span class="tap">Tap to reveal the winner →</span>' : ''}</div>`;
}

async function reveal(awardName, rows, urls) {
  $('.reveal')?.remove();
  const el = document.createElement('div'); el.className = 'reveal';
  el.innerHTML = `<button class="icon-btn rv-close" aria-label="Close">${I.x}</button><div class="rv-stage"><p class="rv-kicker">And the winner of</p><h1 class="rv-award">${esc(awardName)}</h1><div class="rv-drum"><i></i><i></i><i></i></div></div>`;
  document.body.appendChild(el);
  el.querySelector('.rv-close').onclick = () => el.remove();
  if (!rows.length) { await sleep(1200); el.querySelector('.rv-drum')?.remove(); el.querySelector('.rv-stage').insertAdjacentHTML('beforeend', '<p class="muted">No votes yet.</p>'); return; }
  const top = rows.filter(r => r.n === rows[0].n);
  const full = await signFor(top.map(r => r.car), true);
  await sleep(2600); if (!el.isConnected) return;
  const card = r => { const big = r.car.photos?.map(p => full[p]).find(Boolean); return `<div class="rv-card"><div class="rv-img">${big ? `<img src="${esc(safeUrl(big))}" alt="">` : carImg(r.car, urls, true)}</div><div class="rv-body"><p class="rv-num">${numLabel(r.car)}</p><h2>${esc(carName(r.car))}</h2><p>${esc(carMeta(r.car))}</p><p class="rv-votes">${plural(r.n, 'vote')}</p></div></div>`; };
  el.querySelector('.rv-stage').innerHTML = `<p class="rv-kicker">${esc(awardName)}${top.length > 1 ? ' · It’s a tie!' : ''}</p>${top.length > 1 ? `<div class="rv-ties">${top.map(card).join('')}</div>` : card(top[0])}`;
  el.insertAdjacentHTML('afterbegin', '<div class="rv-rays"></div>');
  confetti(220); setTimeout(() => el.isConnected && confetti(120), 900);
}

/* =====================================================================
   VIEW: BIG SCREEN
   ===================================================================== */
function viewScreen(eid) {
  const st = { ev: undefined, awards: [], cars: [], urls: {}, res: { tallies: {}, voters: 0 }, hide: true };
  try { st.hide = localStorage.getItem('tv-hide-' + eid) !== '0'; } catch { }
  appEl.innerHTML = `<div class="screen" id="scr"><div class="scr-left"><div class="skel" style="width:260px;height:400px"></div></div><div class="scr-right"></div></div>`;
  let first = true, leftDone = false, sigE = '', sigR = '';
  poll(async () => ({ ev: await D.getEvent(eid), awards: await D.listAwards(eid) }), 10000, (r, err) => { if (err || !r) return; const s = JSON.stringify(r); if (s === sigE) return; sigE = s; st.ev = r.ev; st.awards = r.awards; render(); });
  poll(() => D.lineup(eid), 30000, async cars => { if (!cars) return; st.cars = cars.filter(c => !c.hidden); st.urls = { ...st.urls, ...await signFor(cars) }; render(); });
  poll(() => D.results(eid), 4000, r => { if (!r) return; const s = JSON.stringify(r); if (s === sigR) return; sigR = s; st.res = r; render(); });
  const ranked = aid => Object.entries(st.res.tallies[aid] || {}).map(([id, n]) => ({ car: st.cars.find(c => c.id === id) || { id, vehicle: 'Removed car', photos: [] }, n })).sort((a, b) => b.n - a.n);
  function render() {
    const root = $('#scr'); if (!root || st.ev === undefined) return;
    if (!st.ev) { root.innerHTML = empty('Event not found', '', I.flag); return; }
    const url = link('e/' + eid);
    if (!leftDone) {
      leftDone = true;
      root.querySelector('.scr-left').innerHTML = `${logoSVG('anim')}<h2>Scan to vote</h2><div class="qr" data-qr="${esc(url)}"></div><div class="url">${esc(url.replace(/^https?:\/\//, ''))}</div><div><div class="scr-total" id="scr-total">0</div><span>voters so far</span></div>`;
      drawAllQR(root.querySelector('.scr-left'));
    }
    $('#scr-total').textContent = st.res.voters;
    root.querySelector('.scr-right').innerHTML = `<p class="eyebrow">${st.ev.status === 'live' ? 'Voting live' : 'Voting ' + esc(st.ev.status)}</p><h1>${esc(st.ev.name)}</h1>
<div class="scr-tools"><a class="btn sm" href="#/admin/${eid}">${I.back} Admin</a><button class="btn sm" data-act="hide">${st.hide ? I.eye + ' Show standings' : I.eyeoff + ' Hide standings'}</button><button class="btn sm" data-act="full">${I.full} Full screen</button></div>
<div class="scr-grid ${st.hide ? 'hide-standings' : ''}">${st.awards.length ? st.awards.map((a, i) => resultsCard(a, ranked(a.id), first ? i : 0, first, st.urls)).join('') : empty('Awards coming soon', 'Add awards from the admin panel.', I.trophy)}</div>`;
    first = false;
  }
  appEl.onclick = e => {
    const a = e.target.closest('[data-act]')?.dataset.act;
    if (a === 'hide') { st.hide = !st.hide; try { localStorage.setItem('tv-hide-' + eid, st.hide ? '1' : '0'); } catch { } render(); return; }
    if (a === 'full') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => { }); return; }
    const r = e.target.closest('[data-reveal]');
    if (r) { const aw = st.awards.find(x => x.id === r.dataset.reveal); if (aw) reveal(aw.name, ranked(aw.id), st.urls); }
  };
}

/* =====================================================================
   INTRO + BOOT
   ===================================================================== */
function intro() {
  const el = $('#intro'); let seen = false;
  try { seen = sessionStorage.getItem('tv-intro'); } catch { }
  if (seen || isAdminRoute() || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return; }
  try { sessionStorage.setItem('tv-intro', '1'); } catch { }
  const streaks = Array.from({ length: 10 }, (_, i) => `<i style="top:${8 + i * 9}%;animation-delay:${(i * 0.37) % 1.1}s;animation-duration:${0.8 + (i % 4) * 0.25}s"></i>`).join('');
  el.innerHTML = `<div class="intro-streaks">${streaks}</div><div class="intro-flash"></div>${logoSVG('anim')}<p class="intro-sub">Start your engines</p>`;
  el.classList.add('play');
  const done = () => { el.classList.add('out'); setTimeout(() => el.remove(), 650); };
  const t = setTimeout(done, 2700);
  el.addEventListener('click', () => { clearTimeout(t); done(); }, { once: true });
}

async function boot() {
  intro();
  try { D = DEMO ? demoAdapter() : await supabaseAdapter(); }
  catch (e) { console.error(e); appEl.innerHTML = shell(`<div class="err-box">Couldn’t connect. Check your signal and refresh.</div>`); return; }
  D.onAuth(u => {
    const was = !!ME?.isAdmin, first = !authKnown;
    ME = u; authKnown = true;
    if (first || (was !== !!u?.isAdmin && (isAdminRoute() || !location.hash || location.hash === '#/'))) route();
    else if (isAdminRoute() && u && !u.isAdmin) route();
  });
  addEventListener('hashchange', route);
  
}
boot();

</script>
